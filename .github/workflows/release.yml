# .github/workflows/release.yml
#
# 语义化发布：只有推送 v* tag 时才发版（tag 应与 Cargo.toml 的 version 一致）。
#   git tag v0.3.1 && git push origin v0.3.1
#
# 不再按 commit count 自动递增 —— b1/b5/b7 这类构建号对使用者没有语义，
# 且会随仓库历史变化而漂移。

name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.3.1），必须已存在于仓库"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::tag must start with 'v' (got '$tag')"; exit 1 ;;
          esac
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "v${cargo_version}" != "$tag" ]; then
            echo "::warning::tag $tag != Cargo.toml version v${cargo_version}"
          fi
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "cargo_version=$cargo_version" >> $GITHUB_OUTPUT

      - name: Set owner to lowercase
        run: echo "OWNER_LC=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build release tarballs
        run: |
          ./build.sh -v "${{ steps.version.outputs.tag }}" -o ./dist
          cd dist && sha256sum quanheng-bench-*.tar.gz > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            **Container image** (multi-arch: linux/amd64 + linux/arm64)

            ```bash
            docker pull ghcr.io/${{ env.OWNER_LC }}/quanheng-bench:${{ steps.version.outputs.tag }}
            docker pull ghcr.io/${{ env.OWNER_LC }}/quanheng-bench:latest
            ```

            **Build from source**

            ```bash
            cargo build --release   # -> target/release/quanheng
            ```

            Offline installers (both architectures) are attached below.
          files: |
            dist/quanheng-bench-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
