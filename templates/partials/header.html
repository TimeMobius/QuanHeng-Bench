<header class="app-header">
  <div class="app-header__inner">
    <a class="brand" href="#/overview" aria-label="LLM 性能监控 · 返回概览">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 12h4l2.5-6.5L13 18l2.5-6h6"/>
        </svg>
      </span>
      <span class="brand__meta">
        <span class="brand__title">LLM 性能监控</span>
        <span class="brand__sub" data-date-label>正在加载日期…</span>
      </span>
    </a>

    <nav class="tabs" id="view-tabs" role="tablist" aria-label="视图导航">
      <a class="tab is-active" id="tab-overview" role="tab" href="#/overview" data-view="overview" aria-selected="true" aria-controls="view-root" tabindex="0">概览</a>
      <a class="tab" id="tab-model" role="tab" href="#/model" data-view="model" aria-selected="false" aria-controls="view-root" tabindex="-1">模型</a>
      <a class="tab" id="tab-compare" role="tab" href="#/compare" data-view="compare" aria-selected="false" aria-controls="view-root" tabindex="-1">对比</a>
      <a class="tab" id="tab-trend" role="tab" href="#/trend" data-view="trend" aria-selected="false" aria-controls="view-root" tabindex="-1">趋势</a>
      <a class="tab" id="tab-runs" role="tab" href="#/runs" data-view="runs" aria-selected="false" aria-controls="view-root" tabindex="-1">运行记录</a>
    </nav>

    <div class="app-header__actions">
      <div class="popover-wrap" id="date-control">
        <button class="btn btn-outline date-btn" type="button" id="date-btn"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="date-popover">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <span class="date-btn__text" data-date-label>—</span>
          <svg class="ico ico--caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="popover popover--date" id="date-popover" role="dialog" aria-label="选择测试日期" hidden>
          <div class="popover__search">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="date-search" placeholder="搜索日期：08-27 或 2026-08" autocomplete="off"
                   aria-label="搜索日期" aria-controls="date-list" data-autofocus>
          </div>
          <div class="date-list" id="date-list" role="listbox" aria-label="可用日期" tabindex="-1"></div>
          <div class="popover__foot">
            <span class="hint" data-date-hint>共 0 个日期</span>
            <button class="btn btn-ghost btn-sm" type="button" data-action="date-today">回到今天</button>
          </div>
        </div>
      </div>

      <button class="icon-btn" type="button" id="theme-btn" aria-label="切换主题（当前：跟随系统）" title="切换主题：跟随系统 / 浅色 / 深色">
        <span class="theme-icon" data-theme-icon aria-hidden="true"></span>
      </button>

      <div class="popover-wrap" id="export-menu">
        <button class="btn btn-outline" type="button" id="export-btn"
                aria-haspopup="menu" aria-expanded="false" aria-controls="export-list">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span>导出</span>
        </button>
        <div class="popover popover--menu" id="export-list" role="menu" aria-labelledby="export-btn" hidden>
          <button class="menu-item" type="button" role="menuitem" data-action="export-all">导出当日全部模型 CSV</button>
          <button class="menu-item" type="button" role="menuitem" data-action="export-model">导出当前模型 CSV</button>
          <p class="menu-note" data-export-note>CSV 由 /api/export.csv 生成</p>
        </div>
      </div>

      <button class="icon-btn" type="button" id="refresh-btn" aria-label="立即刷新数据" title="立即刷新数据">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>

      <button class="btn btn-primary" type="button" id="run-btn">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        <span data-run-label>运行测试</span>
      </button>
      <button class="btn btn-danger" type="button" id="cancel-btn" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span>取消运行</span>
      </button>
    </div>
  </div>

  <div class="status-strip" id="status-strip">
    <div class="status-strip__group">
      <span class="pill pill--none" id="status-pill" data-status-pill>就绪</span>
      <span class="status-strip__msg" id="status-msg" data-status-message>正在加载运行状态…</span>
    </div>
    <div class="status-strip__progress" id="status-progress" data-status-progress hidden>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
           aria-label="当前运行进度" data-status-track>
        <span class="progress__bar" data-status-bar></span>
      </div>
      <span class="status-strip__pct" data-status-pct>0%</span>
    </div>
    <div class="status-strip__meta">
      <span data-updated>数据加载中…</span>
    </div>
  </div>
</header>
