[package]
name = "quanheng-bench"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
description = "QuanHeng-Bench (权衡·基准): a unified yardstick for LLM inference — single-binary load tester with baseline dashboard"
readme = "README.md"
keywords = ["llm", "benchmark", "load-testing", "ttft", "throughput"]
categories = ["command-line-utilities", "web-programming", "development-tools::testing"]

[[bin]]
name = "quanheng"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
minijinja = { version = "2", features = ["json", "loader"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
futures = "0.3"
tokio-cron-scheduler = "0.10"
uuid = { version = "1", features = ["v4"] }
